name: CI

# Tests en cada PR y en cada push a master. El despliegue solo corre en un
# push a master y solo si los tests han pasado (needs: test).
on:
  pull_request:
  push:
    branches: [master]

# Un push nuevo a un PR cancela la ejecución anterior de ese PR. En master no se
# cancela nada, para no cortar un despliegue a medias.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build y tests E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm test

      - name: Subir el informe de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # El job de despliegue sube exactamente este build, el que se ha probado.
      - name: Guardar el build probado
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Desplegar en el VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Descargar el build probado
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # rsync --delete con un dist/ vacío borraría la web: mejor fallar antes.
      - name: Comprobar el build
        run: test -f dist/index.html

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Desplegar (rsync de dist/)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            dist/ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
